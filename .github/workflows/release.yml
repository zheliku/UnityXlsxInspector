name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PACKAGE_DIR: Packages/com.zheliku.unity-xlsx-inspector
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check version and extract release notes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = JSON.parse(fs.readFileSync(`${process.env.PACKAGE_DIR}/package.json`, 'utf8'));
          if (process.env.RELEASE_TAG !== `v${manifest.version}`) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${manifest.version}.`);
          }
          const changelog = fs.readFileSync(`${process.env.PACKAGE_DIR}/CHANGELOG.md`, 'utf8');
          const section = changelog.split(`## [${manifest.version}] - `)[1];
          if (!section) {
            throw new Error(`CHANGELOG.md has no entry for ${manifest.version}.`);
          }
          const notes = section.slice(section.indexOf('\n') + 1).split('\n## [')[0].trim();
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'release-notes.md'), `${notes}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `PACKAGE_NAME=${manifest.name}\nPACKAGE_VERSION=${manifest.version}\n`);
          NODE

      - name: Pack the UPM package
        run: npm pack "./$PACKAGE_DIR" --pack-destination "$RUNNER_TEMP" --ignore-scripts

      - name: Create GitHub Release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/$PACKAGE_NAME-$PACKAGE_VERSION.tgz" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
